name: Build PSVita (CMake)

# Builds a VPK for every pushed branch (except the log branch) and stores the build
# log on the "ci-logs" branch so it can be read with plain git. Pushes to main also
# refresh the development build (one pre-release, build-main, with a fixed download
# link) and publish the version set in CMakeLists.txt: a final version gets its
# release page; a pre-release version only a tag and its VPK parked on the
# development build, archived into the final release's zip later (docs/RELEASING.md).
on:
  push:
    branches-ignore: [ ci-logs ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
      BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
      # Branch whose pushes publish the version set in CMakeLists.txt (docs/RELEASING.md).
      RELEASE_BRANCH: main
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make python3 python3-pip python-is-python3 curl git
          mkdir -p ci

      # The SDK plus packages takes several minutes to install; keep it between runs.
      - name: Restore VitaSDK cache
        id: cache-vitasdk
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vitasdk
          key: vitasdk-${{ runner.os }}-v2

      - name: Install VitaSDK and packages
        if: steps.cache-vitasdk.outputs.cache-hit != 'true'
        run: |
          {
            set -e
            rm -rf "$VITASDK"
            # VitaSDK is now installed through vdpm's pacman-based bootstrap
            # (the old tarball + "vdpm -f" route no longer ships a package client).
            git clone --depth 1 https://github.com/vitasdk/vdpm.git /tmp/vdpm
            cd /tmp/vdpm
            ./bootstrap-vitasdk.sh --install-dir "$VITASDK"
            export PATH="$VITASDK/bin:$PATH"
            # No terminal in CI: let pacman proceed without asking for confirmation.
            export VDPM_NONINTERACTIVE=1
            VDPM="$VITASDK/bin/vdpm"
            [ -x "$VDPM" ] || VDPM=/tmp/vdpm/vdpm
            # Only the libraries this app links against (see CMakeLists.txt).
            "$VDPM" install zlib bzip2 expat openssl curl opus libpng libjpeg-turbo freetype libvita2d
            "$VDPM" list
            test -f "$VITASDK/arm-vita-eabi/lib/libvita2d.a"
            test -f "$VITASDK/share/vita.toolchain.cmake"
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci/sdk.log"

      - name: Save VitaSDK cache
        if: steps.cache-vitasdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vitasdk
          key: vitasdk-${{ runner.os }}-v2

      - name: Add VitaSDK to PATH
        run: echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Update submodules and build
        run: |
          {
            set -e
            git submodule update --init
            cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cmake --build build -j"$(nproc)"
            ls -lh build
          } 2>&1 | tee ci/build.log

      # Pacing, settings file, SPS rewrite and helpers, built for the PC with
      # AddressSanitizer and UBSan (tools/tests).
      - name: PC tests
        run: |
          set -o pipefail
          tools/tests/run.sh build/tests 2>&1 | tee ci/tests.log

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitamoon-vpk
          path: build/*.vpk

      # Fixed link: https://github.com/<owner>/<repo>/releases/download/build-main/vitamoon-main.vpk
      # Updated in place: its tag moves to this commit and its VPK is replaced, so the
      # VPKs of pre-release versions parked on it stay until their final release.
      - name: Publish development build
        if: github.event_name == 'push' && github.ref_name == env.RELEASE_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="build-$BUILD_BRANCH"
          VPK="$(ls build/*.vpk | head -1)"
          cp "$VPK" "vitamoon-$BUILD_BRANCH.vpk"
          TITLE="Build $BUILD_BRANCH (${GITHUB_SHA::7})"
          NOTES="Development build of branch $BUILD_BRANCH, commit ${GITHUB_SHA::7}, $(date -u +%Y-%m-%dT%H:%MZ): \`vitamoon-$BUILD_BRANCH.vpk\`.
          Pre-release versions are not published as releases: their VPK (\`vitamoon-v<version>.vpk\`) waits here, then goes into the zip of their final release."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes "$NOTES" --prerelease
            gh release upload "$TAG" "vitamoon-$BUILD_BRANCH.vpk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "vitamoon-$BUILD_BRANCH.vpk" --repo "$GITHUB_REPOSITORY" \
              --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      # A version not published yet, once built and tested (docs/RELEASING.md):
      # - final (no label): tag v<version> on this commit, a release with its
      #   CHANGELOG.md section as notes and the VPK; then the VPKs of pre-release
      #   versions parked on the development build go into vitamoon-v<version>-betas.zip
      #   on it (tools/dev/archive_betas.py);
      # - pre-release (a label such as beta.1): the tag, and the VPK parked on the
      #   development build as vitamoon-v<version>.vpk, without a release page.
      # Pushes that keep the same version change nothing.
      - name: Publish version
        if: github.event_name == 'push' && github.ref_name == env.RELEASE_BRANCH
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          python3 tools/dev/release_info.py --repo "$GITHUB_REPOSITORY" --notes ci/release-notes.md > ci/release.env
          source ci/release.env
          VPK="$(ls build/*.vpk | head -1)"
          cp "$VPK" "vitamoon-$TAG.vpk"
          if [ "$PRERELEASE" = 1 ]; then
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
              echo "$TAG is already tagged"
              exit 0
            fi
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
            gh release upload "build-$BUILD_BRANCH" "vitamoon-$TAG.vpk" --repo "$GITHUB_REPOSITORY" --clobber
            echo "$TAG tagged, its VPK parked on build-$BUILD_BRANCH"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released"
            exit 0
          fi
          gh release create "$TAG" "vitamoon-$TAG.vpk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file ci/release-notes.md
          python3 tools/dev/archive_betas.py --repo "$GITHUB_REPOSITORY" --final "$TAG" --from-dev-build --apply

      # Always store the logs (also on failure) on the ci-logs branch, one folder per branch.
      - name: Publish build log
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          SAFE_BRANCH="${BUILD_BRANCH//\//-}"
          LOGDIR=/tmp/ci-logs
          rm -rf "$LOGDIR" && mkdir -p "$LOGDIR" && cd "$LOGDIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin ci-logs; then
            git checkout -q -b ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          rm -rf "$SAFE_BRANCH" && mkdir -p "$SAFE_BRANCH"
          cp "$GITHUB_WORKSPACE/ci/build.log" "$SAFE_BRANCH/build.log" 2>/dev/null || echo "no build log (job stopped before the build step)" > "$SAFE_BRANCH/build.log"
          tail -n 400 "$GITHUB_WORKSPACE/ci/sdk.log" > "$SAFE_BRANCH/sdk-tail.log" 2>/dev/null || echo "SDK restored from cache" > "$SAFE_BRANCH/sdk-tail.log"
          cp "$GITHUB_WORKSPACE/ci/tests.log" "$SAFE_BRANCH/tests.log" 2>/dev/null || echo "no test log" > "$SAFE_BRANCH/tests.log"
          echo "status=$JOB_STATUS run=$GITHUB_RUN_ID sha=$GITHUB_SHA date=$(date -u +%FT%TZ)" > "$SAFE_BRANCH/status.txt"
          git add -A
          git commit -q -m "CI log $BUILD_BRANCH ${GITHUB_SHA::7} ($JOB_STATUS)"
          for i in 1 2 3; do
            if git push -q origin HEAD:ci-logs; then break; fi
            sleep 5
            git fetch -q --depth 1 origin ci-logs && git rebase -q FETCH_HEAD || true
          done
